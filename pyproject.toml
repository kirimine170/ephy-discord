[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ephy-discord"
version = "0.2.0"
description = "Read-only Discord adapter for Ephy (milestone O-1)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.9,<4",
  "discord.py>=2.4,<3",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
ephy-discord = "ephy_discord.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ephy_discord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
